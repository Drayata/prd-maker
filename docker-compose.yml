services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: prdforge
      MYSQL_USER: prdforge
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-prdforge_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root_dev_only}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://prdforge:${MYSQL_PASSWORD:-prdforge_dev}@mysql:3306/prdforge
      WEB_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
